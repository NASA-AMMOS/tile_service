name: "CodeQL Security Scan Configuration"

# Keep the default query suite and add the extended security queries.
disable-default-queries: false

queries:
  - uses: security-extended

# Scope note: tile_service is a Java servlet + CLI + Lambda that turns VICAR
# images into DZI tile pyramids. All of our code lives under src/main/java.
#
# src/main/java/gov/nist/isg/pyramidio/ is deliberately NOT excluded. It is a
# local fork of NIST's pyramidio that is compiled into our artifact; the upstream
# Maven coordinate is also declared in pom.xml, but these in-tree copies are what
# actually ship, and Dependabot does not track them. If we don't scan them,
# nothing does.
#
# security-scan.yml compiles the project when every dependency resolves
# publicly and otherwise falls back to `build-mode: none`, which analyzes source
# without resolved types and costs some precision on dataflow through library
# calls. See the header comment there.
paths-ignore:
  # Build output.
  - 'target/**'

  # Not code we wrote, or not code at all.
  - 'docs/**'
  - 'scripts/**'                          # pandoc/LaTeX helpers for the PDF docs
  - 'webapp/resources/openseadragon.min.js'  # vendored minified viewer library
  - 'parse_vicar.html'                    # standalone debugging page
  - '**/*.min.js'

  # Shell-driven smoke tests, not shipped.
  - 'test/**'

query-filters:
  # Style and maintainability suggestions add volume without adding security
  # signal; SonarQube already covers that ground.
  - exclude:
      problem.severity: recommendation
