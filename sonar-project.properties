# SonarQube Cloud configuration for tile_service
#
# Set up per the AMMOS scanning guide:
#   https://wiki.jpl.nasa.gov/display/AmmosArch/Code+Vulnerability+Scanning+Set+Up+for+AMMOS+Open+Source+Software
sonar.projectKey=NASA-AMMOS_tile_service
sonar.organization=nasa-ammos

# Project metadata. projectVersion is overridden from pom.xml by the
# Security-Scan workflow.
sonar.projectName=tile_service
sonar.projectVersion=6.5.8
sonar.projectDescription=ASTRIA Image Tiler - REST service, CLI and Lambda that generate DZI tile pyramids from VICAR planetary images.

# Project links - shown in the SonarQube Cloud UI
sonar.links.scm=https://github.com/NASA-AMMOS/tile_service
sonar.links.issue=https://github.com/NASA-AMMOS/tile_service/issues
sonar.links.ci=https://github.com/NASA-AMMOS/tile_service/actions

# ==========================================
# Analysis scope
# ==========================================
# Our own code only: the Java servlet/CLI/Lambda and the servlet deployment
# descriptors.
#
# src/main/java/gov/nist/isg/pyramidio/ is intentionally NOT excluded: it is a
# local fork of NIST's pyramidio that is compiled into our artifact. Dependabot
# tracks the Maven coordinate, not these in-tree copies, so if we don't scan them
# nothing does. They are excluded from duplication detection below, since
# duplicating upstream is the point of a fork.
#
# Deliberately not listed: docs/ (a generated PDF), scripts/ (pandoc/LaTeX
# helpers that build it), and parse_vicar.html (a standalone debugging page).
sonar.sources=src/main,webapp

# test/ holds shell scripts that drive the built artifacts, not a JUnit suite,
# so there is nothing to declare as sonar.tests.

sonar.exclusions=\
  target/**,\
  webapp/resources/openseadragon.min.js,\
  **/*.min.js,\
  **/*.zip,\
  **/*.pdf,\
  **/*.png,\
  **/*.jpg

# Duplication exclusions - vendored code is not ours to de-duplicate, and the
# deployment descriptors repeat by design, one per Maven profile.
sonar.cpd.exclusions=\
  src/main/java/gov/nist/isg/**,\
  webapp/WEB-INF/**,\
  **/*.min.js

# ==========================================
# Java analysis without a build
# ==========================================
# This project cannot be compiled on a public GitHub runner: it depends on
# gov.nasa.jpl.ammos.ids:mars:3.8.2-SNAPSHOT and
# gov.nasa.jpl.ammos.ids:vicario:2.7.0-SNAPSHOT, which live in JPL Artifactory
# and are not publicly resolvable. So there is no bytecode to hand the analyzer.
#
# sonar.java.binaries points at an empty directory that the Security-Scan
# workflow creates. Leaving the property unset is not an error in current
# SonarJava, but it raises a "Missing 'sonar.java.binaries' property" warning on
# every analysis; pointing it at a real (if empty) directory keeps the project's
# warning list meaningful. Either way the result is the same: rules that need
# resolved types produce fewer and less precise findings, and CodeQL carries most
# of the security signal for this repo.
#
# If this ever runs on a runner with Artifactory access, build first
# (mvn -B -DskipTests package) and this property will pick up the real classes
# with no further change.
sonar.java.binaries=target/classes
sonar.java.source=21

sonar.sourceEncoding=UTF-8

sonar.tags=planetary,nasa,imagery,java,vicar,tiles,deep-zoom

# New Code: anything added in the last 30 days counts as new.
sonar.leak.period=30

# sonar.sarifReportPaths is supplied by the Security-Scan workflow, which
# passes the repaired CodeQL reports on the scanner command line.
